        categoryId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        occurredAt: {type: string, format: date-time}
        note: {type: string, maxLength: 2000}
    UpdateTransactionRequest:
      type: object
      additionalProperties: false
