        expectedVersion: {type: integer, format: int64, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 160}
        amount: {type: integer, format: int64, minimum: 1}
        accountId: {type: string, format: uuid}
        categoryId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        occurredAt: {type: string, format: date-time}
        note: {type: string, maxLength: 2000}
    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [sourceAccountId, destinationAccountId, title, amount, occurredAt]
      properties:
        sourceAccountId: {type: string, format: uuid}
        destinationAccountId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 160}
        amount: {type: integer, format: int64, minimum: 1}
        occurredAt: {type: string, format: date-time}
        note: {type: string, maxLength: 2000}
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required: [amount, occurredAt]
      properties:
