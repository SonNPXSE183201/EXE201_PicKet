        note: {type: string, maxLength: 2000}
    TransactionSplit:
      type: object
      additionalProperties: false
      required: [id, transactionId, categoryId, amount, version, createdAt, updatedAt, deletedAt]
      properties:
        id: {type: string, format: uuid}
        transactionId: {type: string, format: uuid}
        categoryId: {type: string, format: uuid}
        amount: {type: integer, format: int64, minimum: 1}
        version: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        deletedAt: {type: 'null'}
    TransactionSplitInput:
      type: object
      additionalProperties: false
      required: [categoryId, amount]
      properties:
        categoryId: {type: string, format: uuid}
        amount: {type: integer, format: int64, minimum: 1}
    TransactionSplitsResponse:
      type: object
      additionalProperties: false
      required: [splits]
      properties:
        splits:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/TransactionSplit'}
    SetTransactionSplitsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, splits]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        splits:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/TransactionSplitInput'}
    SetTransactionSplitsResponse:
      type: object
      additionalProperties: false
      required: [transaction, splits]
      properties:
        transaction: {$ref: '#/components/schemas/Transaction'}
        splits:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/TransactionSplit'}
    OcrFallbackJob:
      type: object
      additionalProperties: false
      required: [id, storagePath, localConfidence, status, result, errorCode, createdAt, updatedAt, expiresAt, startedAt, completedAt]
      properties:
        id: {type: string, format: uuid}
        storagePath: {type: string, maxLength: 1024}
        localConfidence: {type: number, minimum: 0, maximum: 1}
        status: {type: string, enum: [queued, processing, completed, failed, cancelled, expired]}
        result:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        errorCode:
          oneOf:
            - type: string
            - type: 'null'
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        startedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        completedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    OcrFallbackJobsResponse:
      type: object
      additionalProperties: false
      required: [jobs]
      properties:
        jobs:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/OcrFallbackJob'}
    OcrFallbackJobResponse:
      type: object
      additionalProperties: false
      required: [job]
      properties:
        job: {$ref: '#/components/schemas/OcrFallbackJob'}
    CreateOcrFallbackJobRequest:
      type: object
      additionalProperties: false
      required: [storagePath, localConfidence, idempotencyKey]
      properties:
        storagePath:
          type: string
          maxLength: 1024
          pattern: '^[^/]+/ocr/.+\.(jpg|jpeg|png|webp)$'
        localConfidence: {type: number, minimum: 0, maximum: 1}
        idempotencyKey: {type: string, format: uuid}
    ReceiptLineItem:
      type: object
      additionalProperties: false
      required: [id, receiptId, name, quantity, unitPrice, total, confidence, version, createdAt, updatedAt, deletedAt]
      properties:
        id: {type: string, format: uuid}
        receiptId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        quantity: {type: number, exclusiveMinimum: 0}
        unitPrice:
          oneOf: [{type: integer, format: int64, minimum: 0}, {type: 'null'}]
        total: {type: integer, format: int64, minimum: 1}
        confidence:
          oneOf: [{type: number, minimum: 0, maximum: 1}, {type: 'null'}]
        version: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        deletedAt: {type: 'null'}
    ReceiptRecord:
      type: object
      additionalProperties: false
      required: [id, transactionId, storagePath, merchant, detectedTotal, purchasedAt, currencyCode, confidence, ocrProvider, reviewRequired, rawText, imageSha256, status, version, createdAt, updatedAt, deletedAt, lineItems]
      properties:
        id: {type: string, format: uuid}
        transactionId:
          oneOf: [{type: string, format: uuid}, {type: 'null'}]
        storagePath: {type: string, maxLength: 1024}
        merchant:
          oneOf: [{type: string, maxLength: 160}, {type: 'null'}]
        detectedTotal:
          oneOf: [{type: integer, format: int64, minimum: 1}, {type: 'null'}]
        purchasedAt:
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
        currencyCode: {type: string, pattern: '^[A-Z]{3}$'}
        confidence:
          oneOf: [{type: number, minimum: 0, maximum: 1}, {type: 'null'}]
        ocrProvider: {type: string, enum: [ml-kit, pp-ocr, manual]}
        reviewRequired: {type: boolean}
        rawText:
          oneOf: [{type: string, maxLength: 32000}, {type: 'null'}]
        imageSha256:
          oneOf: [{type: string, pattern: '^[0-9a-f]{64}$'}, {type: 'null'}]
        status: {type: string, enum: [processing, review_required, confirmed, failed]}
        version: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        deletedAt:
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
        lineItems:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ReceiptLineItem'}
    ReceiptRecordsResponse:
      type: object
      required: [receipts]
      properties:
        receipts:
          type: array
          items: {$ref: '#/components/schemas/ReceiptRecord'}
    ReceiptRecordResponse:
      type: object
      required: [receipt]
      properties:
        receipt: {$ref: '#/components/schemas/ReceiptRecord'}
    CreateReceiptRecordRequest:
      type: object
      additionalProperties: false
