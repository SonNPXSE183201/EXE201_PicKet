openapi: 3.1.0
info:
  title: Picket API
  version: 0.1.0
  description: REST API for the Picket Next.js web and Expo Android clients.
servers:
  - url: http://localhost:8080
paths:
  /v1/admin/overview:
    get:
      operationId: getAdminOverview
      summary: Get an audited, paginated overview for active staff members
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Staff overview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOverview'}
        '400': {description: Invalid page}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Active staff membership is required}
  /v1/admin/users/{id}/actions:
    post:
      operationId: performAdminUserAction
      summary: Perform a confirmed, audited action on a user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, confirmation]
                  properties:
                    action: {type: string, enum: [suspend]}
                    confirmation: {type: string, enum: [SUSPEND]}
                - type: object
                  additionalProperties: false
                  required: [action, confirmation]
                  properties:
                    action: {type: string, enum: [restore]}
                    confirmation: {type: string, enum: [RESTORE]}
                - type: object
                  additionalProperties: false
                  required: [action, confirmation]
                  properties:
                    action: {type: string, enum: [reset_password]}
                    confirmation: {type: string, enum: [RESET]}
                - type: object
                  additionalProperties: false
                  required: [action, confirmation, tier]
                  properties:
                    action: {type: string, enum: [grant_plan]}
                    confirmation: {type: string, enum: [GRANT]}
                    tier: {type: string, enum: [free, plus, pro]}
      responses:
        '200':
          description: Action completed and audited
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: {type: boolean, enum: [true]}
        '400': {description: Invalid action or confirmation}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Active staff membership is required}
        '404': {description: Target user not found}
  /v1/entitlements:
    get:
      operationId: getCurrentEntitlements
      summary: Get the authenticated user's server-authoritative plan and OCR quota
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current plan and rolling 24-hour OCR quota
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tier, ocrFallbackDailyLimit, ocrFallbackUsed, ocrFallbackRemaining]
                properties:
                  tier: {type: string, enum: [free, plus, pro]}
                  ocrFallbackDailyLimit: {type: integer, minimum: 0}
                  ocrFallbackUsed: {type: integer, minimum: 0}
                  ocrFallbackRemaining: {type: integer, minimum: 0}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/billing/google-play/verify:
    post:
      operationId: verifyGooglePlayPurchase
      summary: Verify a Picket subscription with Google Play and refresh server entitlements
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productId, purchaseToken]
              properties:
                productId:
                  type: string
                  enum: [picket_plus_monthly, picket_plus_yearly, picket_pro_monthly, picket_pro_yearly]
                purchaseToken:
                  type: string
                  minLength: 1
                  maxLength: 10000
      responses:
        '200':
          description: Server-authoritative Google Play verification result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [verified, active, tier, expiresAt]
                properties:
                  verified: {type: boolean, enum: [true]}
                  active: {type: boolean}
                  tier: {type: string, enum: [free, plus, pro]}
                  expiresAt: {type: string, format: date-time}
        '400': {description: Unknown product or invalid purchase token}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {description: Request body is too large}
        '502': {description: Google Play verifier is unavailable or returned an invalid result}
  /v1/account:
    delete:
      operationId: deleteAccount
      summary: Permanently delete the current user's media, data and auth user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: {type: string, enum: [DELETE]}
      responses:
        '200':
          description: Account permanently deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: {type: boolean, enum: [true]}
        '400': {description: Exact confirmation is required}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Recent sign-in is required}
        '503': {description: Account deletion could not be completed}
  /v1/export:
    get:
      operationId: exportFinance
      summary: Export all finance data owned by the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Versioned JSON export; responses must not be cached
          content:
            application/json:
              schema:
                type: object
                required: [format, schemaVersion, exportedAt, revision, data]
                properties:
                  format: {type: string, enum: [picket-export-v1]}
                  schemaVersion: {type: integer, enum: [1]}
                  exportedAt: {type: string, format: date-time}
                  revision: {type: integer, minimum: 0}
                  data: {type: object, additionalProperties: true}
        '400': {description: No finance data is available}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/import:
    post:
      operationId: validateFinanceImport
      summary: Validate and summarize a versioned finance export without writing data
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinanceExport'}
      responses:
        '200':
          description: Export is valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinanceImportSummary'}
        '400': {description: Invalid export file}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {description: Request exceeds 11 MB}
    put:
      operationId: restoreFinanceImport
      summary: Transactionally replace finance data from a validated export
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, confirmation, export]
              properties:
                expectedRevision: {type: integer, minimum: 0}
                confirmation: {type: string, enum: [RESTORE]}
                export: {$ref: '#/components/schemas/FinanceExport'}
      responses:
        '200':
          description: Finance data restored
          content:
            application/json:
              schema:
                type: object
                required: [restored, revision]
                properties:
                  restored: {type: boolean, enum: [true]}
                  revision: {type: integer, minimum: 1}
        '400': {description: Invalid restore request}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Snapshot revision conflict}
        '413': {description: Request exceeds 11 MB}
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/accounts:
    get:
      operationId: listAccounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active financial accounts owned by the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createAccount
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400': {description: Invalid account data}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Idempotency or business rule conflict}
  /v1/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400': {description: Invalid account data}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Account version conflict}
    delete:
      operationId: archiveAccount
      security:
        - bearerAuth: []
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Account archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400': {description: Invalid account identifier or version}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Account version conflict}
  /v1/categories:
    get:
      operationId: listCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active default and custom categories owned by the current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoriesResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createCategory
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCategoryRequest'}
      responses:
        '201':
          description: Custom category created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryResponse'}
        '400': {description: Invalid category data}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Idempotency or duplicate name conflict}
  /v1/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCategoryRequest'}
      responses:
        '200':
          description: Custom category updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryResponse'}
        '400': {description: Invalid category data}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Category version conflict or immutable default category}
    delete:
      operationId: archiveCategory
      security:
        - bearerAuth: []
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Custom category archived
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryResponse'}
        '400': {description: Invalid category identifier or version}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Category version conflict or immutable default category}
  /v1/budgets:
    get:
      operationId: listBudgets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active budgets owned by the current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createBudget
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBudgetRequest'}
      responses:
        '201':
          description: Budget created idempotently
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetResponse'}
        '400': {description: Invalid budget data}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Idempotency or category uniqueness conflict}
  /v1/budgets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateBudget
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateBudgetRequest'}
      responses:
        '200':
          description: Budget updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetResponse'}
        '400': {description: Invalid budget data}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Budget version conflict}
    delete:
      operationId: archiveBudget
      security:
        - bearerAuth: []
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Budget archived
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetResponse'}
        '400': {description: Invalid budget identifier or version}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Budget version conflict}
  /v1/transactions:
    get:
      operationId: listTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Recent active transactions owned by the current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createTransaction
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTransactionRequest'}
      responses:
        '201':
          description: Income or expense transaction created atomically
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionResponse'}
        '400': {description: Invalid transaction data}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Idempotency or business rule conflict}
  /v1/transactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTransactionRequest'}
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionResponse'}
        '400': {description: Invalid transaction data}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Transaction version or business rule conflict}
    delete:
      operationId: archiveTransaction
      security:
        - bearerAuth: []
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Transaction archived
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionResponse'}
        '400': {description: Invalid transaction identifier or version}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Transaction version or business rule conflict}
  /v1/transfers:
    post:
      operationId: createTransfer
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTransferRequest'}
      responses:
        '201':
          description: Transfer created atomically between same-currency accounts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionResponse'}
        '400': {description: Invalid transfer data}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Idempotency or business rule conflict}
  /v1/transactions/{id}/refunds:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: createRefund
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRefundRequest'}
      responses:
        '201':
          description: Partial or full refund created without exceeding the source expense
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionResponse'}
        '400': {description: Invalid refund data}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Idempotency or business rule conflict}
  /v1/transactions/{id}/splits:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listTransactionSplits
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Category allocation for a transaction
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionSplitsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      operationId: setTransactionSplits
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetTransactionSplitsRequest'}
      responses:
        '200':
          description: Split allocation replaced atomically
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetTransactionSplitsResponse'}
        '400': {description: Split total or category is invalid}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Transaction version or business rule conflict}
  /v1/ocr/jobs:
    get:
      summary: List recent OCR fallback jobs
      operationId: listOcrFallbackJobs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent server OCR fallback jobs owned by the current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OcrFallbackJobsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Queue a private receipt image for server OCR
      operationId: createOcrFallbackJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOcrFallbackJobRequest'}
      responses:
        '202':
          description: OCR fallback job queued or idempotently returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OcrFallbackJobResponse'}
        '400': {description: Invalid OCR job data}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Private source image not found}
        '429': {description: Rolling 24-hour plan quota exceeded}
  /v1/receipts:
    get:
      summary: List recent receipt records
      operationId: listReceipts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Receipts owned by the current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceiptRecordsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Create a structured receipt and line items
      operationId: createReceipt
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateReceiptRecordRequest'}
      responses:
        '201':
          description: Receipt and line items created atomically
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceiptRecordResponse'}
        '400': {description: Invalid receipt or line-item data}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Duplicate image hash}
  /v1/receipts/duplicates:
    post:
      summary: Find exact or likely duplicate receipts
      operationId: findDuplicateReceipts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FindDuplicateReceiptRequest'}
      responses:
        '200':
          description: Up to five duplicate candidates
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DuplicateReceiptsResponse'}
        '400': {description: Insufficient duplicate matching data}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/receipts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Get a receipt with line items
      operationId: getReceipt
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Receipt detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceiptRecordResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Receipt not found}
    put:
      summary: Review receipt metadata and atomically replace line items
      operationId: updateReceipt
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateReceiptRecordRequest'}
      responses:
        '200':
          description: Reviewed receipt with replacement line items
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceiptRecordResponse'}
        '400': {description: Invalid receipt review or line items}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Receipt not found}
        '409': {description: Receipt version conflict}
  /v1/ocr/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Get an OCR fallback job
      operationId: getOcrFallbackJob
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current state and result of an OCR fallback job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OcrFallbackJobResponse'}
        '400': {description: Invalid OCR job identifier}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: OCR job not found}
  /v1/finance/snapshot:
    get:
      operationId: getFinanceSnapshot
      deprecated: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current finance contract assembled from normalized tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceSnapshotEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: saveFinanceSnapshot
      deprecated: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSnapshotRequest'
      responses:
        '200':
          description: Snapshot saved
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision:
                    type: integer
                    format: int64
        '400':
          description: Invalid finance contract
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Optimistic concurrency conflict
  /v1/me:
    get:
      operationId: getCurrentProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated profile and preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/onboarding:
    post:
      operationId: completeOnboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOnboardingRequest'
      responses:
        '201':
          description: Profile, preferences and first wallet created atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteOnboardingResult'
        '400':
          description: Invalid onboarding data
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/profile:
    patch:
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: {type: string, maxLength: 120}
                avatar_url: {type: string, maxLength: 2048}
                locale: {type: string, maxLength: 16}
                timezone: {type: string, maxLength: 80}
      responses:
        '200': {description: Profile updated}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/preferences:
    patch:
      operationId: updatePreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                persona: {type: string, maxLength: 80}
                goal: {type: string, maxLength: 120}
                currency_code: {type: string, pattern: '^[A-Z]{3}$'}
                hide_balance: {type: boolean}
      responses:
        '200': {description: Preferences updated}
        '401': {$ref: '#/components/responses/Unauthorized'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid Supabase access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AdminOverview:
      type: object
      additionalProperties: false
      required: [totalUsers, totalLedgers, users, audit, settings]
      properties:
        totalUsers: {type: integer, minimum: 0}
        totalLedgers: {type: integer, minimum: 0}
        users:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            required: [id, email, createdAt, bannedUntil, revision, entryCount]
            properties:
              id: {type: string, format: uuid}
              email: {type: string, format: email}
              createdAt: {type: string, format: date-time}
              bannedUntil: {type: [string, 'null'], format: date-time}
              revision: {type: [integer, 'null'], minimum: 0}
              entryCount: {type: integer, minimum: 0}
        audit:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [action, target, createdAt]
            properties:
              action: {type: string}
              target: {type: [string, 'null']}
              createdAt: {type: string, format: date-time}
        settings:
          type: object
          additionalProperties: false
          required: [maintenance, notice]
          properties:
            maintenance: {type: boolean}
            notice: {type: string}
    FinancialAccount:
      type: object
      additionalProperties: false
      required: [id, name, kind, currencyCode, openingBalance, version, createdAt, updatedAt, deletedAt, archived]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
        kind: {type: string, enum: [cash, bank, ewallet, other]}
        currencyCode: {type: string, pattern: '^[A-Z]{3}$'}
        openingBalance: {type: integer, format: int64}
        version: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        deletedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        archived: {type: boolean}
    AccountsResponse:
      type: object
      additionalProperties: false
      required: [accounts]
      properties:
        accounts:
          type: array
          items: {$ref: '#/components/schemas/FinancialAccount'}
    AccountResponse:
      type: object
      additionalProperties: false
      required: [account]
      properties:
        account: {$ref: '#/components/schemas/FinancialAccount'}
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, kind, currencyCode, openingBalance]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        kind: {type: string, enum: [cash, bank, ewallet, other]}
        currencyCode: {type: string, pattern: '^[A-Z]{3}$'}
        openingBalance: {type: integer, format: int64}
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 80}
        kind: {type: string, enum: [cash, bank, ewallet, other]}
        currencyCode: {type: string, pattern: '^[A-Z]{3}$'}
    Category:
      type: object
      additionalProperties: false
      required: [id, name, kind, color, icon, custom, version, createdAt, updatedAt, deletedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
        kind: {type: string, enum: [expense, income, both]}
        color:
          oneOf:
            - type: string
              pattern: '^#[0-9A-F]{6}$'
            - type: 'null'
        icon:
          oneOf:
            - type: string
              maxLength: 80
            - type: 'null'
        custom: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        deletedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    CategoriesResponse:
      type: object
      additionalProperties: false
      required: [categories]
      properties:
        categories:
          type: array
          items: {$ref: '#/components/schemas/Category'}
    CategoryResponse:
      type: object
      additionalProperties: false
      required: [category]
      properties:
        category: {$ref: '#/components/schemas/Category'}
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        kind: {type: string, enum: [expense, income, both]}
        color:
          oneOf:
            - type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
            - type: 'null'
        icon:
          oneOf:
            - type: string
              maxLength: 80
            - type: 'null'
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 80}
        kind: {type: string, enum: [expense, income, both]}
        color:
          oneOf:
            - type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
            - type: 'null'
        icon:
          oneOf:
            - type: string
              maxLength: 80
            - type: 'null'
    Budget:
      type: object
      additionalProperties: false
      required: [id, categoryId, name, defaultLimit, alertPercent, active, version, createdAt, updatedAt, deletedAt]
      properties:
        id: {type: string, format: uuid}
        categoryId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        defaultLimit: {type: integer, format: int64, minimum: 1}
        alertPercent: {type: integer, minimum: 1, maximum: 100}
        active: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        deletedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    BudgetsResponse:
      type: object
      additionalProperties: false
      required: [budgets]
