name: picket

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  caddy:
    <<: *service-defaults
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      PICKET_API_DOMAIN: ${PICKET_API_DOMAIN}
      PICKET_WEB_DOMAIN: ${PICKET_WEB_DOMAIN}
      PICKET_LANDING_DOMAIN: ${PICKET_LANDING_DOMAIN}
      PICKET_LEGACY_WEB_DOMAIN: ${PICKET_LEGACY_WEB_DOMAIN:-picket.51-79-207-154.sslip.io}
      PICKET_LEGACY_API_DOMAIN: ${PICKET_LEGACY_API_DOMAIN:-api.51-79-207-154.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/landing/dist:/srv/picket-landing:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - edge
    cpus: 0.25
    mem_limit: 160m

  web:
    <<: *service-defaults
    image: ${PICKET_WEB_IMAGE:-picket-web:local}
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    environment:
      APP_BASE_URL: https://${PICKET_WEB_DOMAIN}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    expose:
      - "3000"
    networks:
      - edge
    cap_drop:
      - ALL
    cpus: 0.75
    mem_limit: 768m

  api:
    <<: *service-defaults
    image: ${PICKET_API_IMAGE:-picket-api:local}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      PORT: "8080"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      LEARNING_AI_ENABLED: ${LEARNING_AI_ENABLED:-false}
      GOOGLE_PLAY_BILLING_ENABLED: ${GOOGLE_PLAY_BILLING_ENABLED:-false}
      PAYOS_ENABLED: ${PAYOS_ENABLED:-false}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_ACCOUNT_NUMBER: ${PAYOS_ACCOUNT_NUMBER:-}
      PAYOS_RETURN_URL: https://${PICKET_WEB_DOMAIN}/billing/return
      PAYOS_WORKER_SECRET: ${PAYOS_WORKER_SECRET:-}
      QUICK_LOGIN_ENABLED: ${QUICK_LOGIN_ENABLED:-false}
      QUICK_LOGIN_ENCRYPTION_KEY: ${QUICK_LOGIN_ENCRYPTION_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      ADMIN_TELEMETRY_ENABLED: ${ADMIN_TELEMETRY_ENABLED:-false}
    expose:
      - "8080"
    networks:
      - edge
    read_only: true
    cap_drop:
      - ALL
    cpus: 0.50
    mem_limit: 256m

  ocr-provider:
    <<: *service-defaults
    image: ${PICKET_OCR_PROVIDER_IMAGE:-picket-ocr-provider:local}
    build:
      context: ./services/ocr-provider
      dockerfile: Dockerfile
      args:
        PRELOAD_MODELS: ${OCR_PRELOAD_MODELS:-1}
    environment:
      OCR_PROVIDER_TOKEN: ${OCR_PROVIDER_TOKEN}
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-2}
      OMP_NUM_THREADS: "1"
    expose:
      - "8000"
    networks:
      - backend
    cap_drop:
      - ALL
    shm_size: 512m
    cpus: 2.25
    mem_limit: 4g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 180s

  ocr-worker:
    <<: *service-defaults
    image: ${PICKET_OCR_WORKER_IMAGE:-picket-ocr-worker:local}
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      OCR_PROVIDER_URL: http://ocr-provider:8000/predict
      OCR_PROVIDER_TOKEN: ${OCR_PROVIDER_TOKEN}
      OCR_ALLOW_INSECURE_PRIVATE_URL: "true"
      OCR_WORKER_ID: ${OCR_WORKER_ID:-picket-vps-worker-01}
      OCR_POLL_INTERVAL_MS: ${OCR_POLL_INTERVAL_MS:-2000}
    depends_on:
      ocr-provider:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    cap_drop:
      - ALL
    cpus: 0.25
    mem_limit: 192m

  learning-worker:
    <<: *service-defaults
    profiles: [learning-ai]
    image: ${PICKET_LEARNING_WORKER_IMAGE:-picket-learning-worker:local}
    build:
      context: ./apps/api
      dockerfile: Dockerfile.learning-worker
    environment:
      APP_ENV: production
      LEARNING_AI_ENABLED: ${LEARNING_AI_ENABLED:-false}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      LEARNING_AI_POLL_INTERVAL_MS: ${LEARNING_AI_POLL_INTERVAL_MS:-2000}
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    cpus: 0.25
    mem_limit: 192m

  admin-worker:
    <<: *service-defaults
    profiles: [admin]
    image: ${PICKET_ADMIN_WORKER_IMAGE:-picket-admin-worker:local}
    build:
      context: ./deploy/admin-worker
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      PLAY_REPORTS_BUCKET: ${PLAY_REPORTS_BUCKET:-}
      PLAY_VITALS_ENABLED: ${PLAY_VITALS_ENABLED:-false}
      PLAY_FINANCIAL_ENABLED: ${PLAY_FINANCIAL_ENABLED:-false}
      ADMIN_SMTP_PROBE: ${ADMIN_SMTP_PROBE:-false}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/play-reporting.json
      ADMIN_WORKER_INTERVAL: "300"
      PAYOS_ENABLED: ${PAYOS_ENABLED:-false}
      PAYOS_WORKER_SECRET: ${PAYOS_WORKER_SECRET:-}
    volumes:
      - caddy_logs:/logs:ro
      - admin_worker_state:/state
      - ./deploy/secrets:/run/secrets:ro
      - ./deploy/backups:/backups:ro
    networks: [edge, backend]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    cpus: 0.25
    mem_limit: 192m

networks:
  edge:
  backend:

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  admin_worker_state:
