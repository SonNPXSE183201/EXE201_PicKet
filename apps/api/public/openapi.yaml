openapi: 3.1.0
info:
  title: Picket API
  version: 0.1.0
  description: REST façade used while Picket migrates from Flutter to Next.js and Expo.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/finance/snapshot:
    get:
      operationId: getFinanceSnapshot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current versioned finance snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceSnapshotEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: saveFinanceSnapshot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSnapshotRequest'
      responses:
        '200':
          description: Snapshot saved
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision:
                    type: integer
                    format: int64
        '400':
          description: Invalid snapshot
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Optimistic concurrency conflict
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid Supabase access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          const: ok
        service:
          type: string
        version:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    FinanceSnapshotEnvelope:
      type: object
      required: [revision, payload, updatedAt]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        payload:
          oneOf:
            - $ref: '#/components/schemas/FinancePayload'
            - type: 'null'
        updatedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    SaveSnapshotRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, payload]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        payload:
          $ref: '#/components/schemas/FinancePayload'
    FinancePayload:
      type: object
      required: [version, name, onboarded, hideBalance, wallets, entries, budgets, bills, keepsakes]
      properties:
        version:
          type: integer
          enum: [1, 2]
        name:
          type: string
        onboarded:
          type: boolean
        hideBalance:
          type: boolean
        wallets:
          type: array
          items:
            type: object
        entries:
          type: array
          items:
            type: object
        budgets:
          type: array
          items:
            type: object
        bills:
          type: array
          items:
            type: object
        keepsakes:
          type: array
          items:
            type: object
        subscriptions:
          type: array
          items:
            type: object
        closedMonths:
          type: array
          items:
            type: object
        customCategories:
          type: array
          items:
            type: string
        preferences:
          type: object
          additionalProperties: true
