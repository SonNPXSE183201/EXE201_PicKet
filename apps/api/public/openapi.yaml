      properties:
        transactionId:
          oneOf: [{type: string, format: uuid}, {type: 'null'}]
        storagePath: {type: string, maxLength: 1024}
        merchant:
          oneOf: [{type: string, maxLength: 160}, {type: 'null'}]
        detectedTotal:
          oneOf: [{type: integer, format: int64, minimum: 1}, {type: 'null'}]
        purchasedAt:
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
        currencyCode: {type: string, pattern: '^[A-Z]{3}$'}
        confidence:
          oneOf: [{type: number, minimum: 0, maximum: 1}, {type: 'null'}]
        ocrProvider: {type: string, enum: [ml-kit, pp-ocr, manual]}
        reviewRequired: {type: boolean}
        rawText:
          oneOf: [{type: string, maxLength: 32000}, {type: 'null'}]
        imageSha256:
          oneOf: [{type: string, pattern: '^[0-9a-f]{64}$'}, {type: 'null'}]
        lineItems:
          type: array
          maxItems: 100
          items:
            type: object
            required: [name, quantity, total]
            properties:
              name: {type: string, minLength: 1, maxLength: 200}
              quantity: {type: number, exclusiveMinimum: 0}
              unitPrice:
                oneOf: [{type: integer, format: int64, minimum: 0}, {type: 'null'}]
              total: {type: integer, format: int64, minimum: 1}
              confidence:
                oneOf: [{type: number, minimum: 0, maximum: 1}, {type: 'null'}]
    UpdateReceiptRecordRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, merchant, detectedTotal, purchasedAt, reviewRequired, lineItems]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        merchant:
          oneOf: [{type: string, maxLength: 160}, {type: 'null'}]
        detectedTotal:
          oneOf: [{type: integer, format: int64, minimum: 1}, {type: 'null'}]
        purchasedAt:
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
        reviewRequired: {type: boolean}
        lineItems:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [name, quantity, total]
            properties:
              name: {type: string, minLength: 1, maxLength: 200}
              quantity: {type: number, exclusiveMinimum: 0}
              unitPrice:
                oneOf: [{type: integer, format: int64, minimum: 0}, {type: 'null'}]
              total: {type: integer, format: int64, minimum: 1}
              confidence:
                oneOf: [{type: number, minimum: 0, maximum: 1}, {type: 'null'}]
    FindDuplicateReceiptRequest:
      type: object
      additionalProperties: false
      properties:
        imageSha256:
          oneOf: [{type: string, pattern: '^[0-9a-f]{64}$'}, {type: 'null'}]
        merchant:
          oneOf: [{type: string, maxLength: 160}, {type: 'null'}]
        purchasedAt:
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
        total:
          oneOf: [{type: integer, format: int64, minimum: 1}, {type: 'null'}]
    DuplicateReceiptsResponse:
      type: object
      required: [duplicates]
      properties:
        duplicates:
          type: array
          maxItems: 5
          items:
            type: object
            required: [id, matchType]
            properties:
              id: {type: string, format: uuid}
              matchType: {type: string, enum: [exact_hash, merchant_date_total]}
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          const: ok
        service:
          type: string
        version:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    FinanceSnapshotEnvelope:
      type: object
      required: [revision, payload, updatedAt]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
