openapi: 3.1.0
info:
  title: Picket API
  version: 0.1.0
  description: REST façade used while Picket migrates from Flutter to Next.js and Expo.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/finance/snapshot:
    get:
      operationId: getFinanceSnapshot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current finance contract assembled from normalized tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceSnapshotEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: saveFinanceSnapshot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSnapshotRequest'
      responses:
        '200':
          description: Snapshot saved
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision:
                    type: integer
                    format: int64
        '400':
          description: Invalid finance contract
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Optimistic concurrency conflict
  /v1/me:
    get:
      operationId: getCurrentProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated profile and preferences
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/onboarding:
    post:
      operationId: completeOnboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOnboardingRequest'
      responses:
        '201':
          description: Profile, preferences and first wallet created atomically
        '400':
          description: Invalid onboarding data
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/profile:
    patch:
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: {type: string, maxLength: 120}
                avatar_url: {type: string, maxLength: 2048}
                locale: {type: string, maxLength: 16}
                timezone: {type: string, maxLength: 80}
      responses:
        '200': {description: Profile updated}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/preferences:
    patch:
      operationId: updatePreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                persona: {type: string, maxLength: 80}
                goal: {type: string, maxLength: 120}
                currency_code: {type: string, pattern: '^[A-Z]{3}$'}
                hide_balance: {type: boolean}
      responses:
        '200': {description: Preferences updated}
        '401': {$ref: '#/components/responses/Unauthorized'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid Supabase access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          const: ok
        service:
          type: string
        version:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    FinanceSnapshotEnvelope:
      type: object
      required: [revision, payload, updatedAt]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        payload:
          oneOf:
            - $ref: '#/components/schemas/FinancePayload'
            - type: 'null'
        updatedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    SaveSnapshotRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, payload]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        payload:
          $ref: '#/components/schemas/FinancePayload'
    CompleteOnboardingRequest:
      type: object
      additionalProperties: false
      required: [displayName, persona, goal, currencyCode, walletName, openingBalance]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 120}
        persona: {type: string, minLength: 1, maxLength: 80}
        goal: {type: string, minLength: 1, maxLength: 120}
        currencyCode: {type: string, pattern: '^[A-Z]{3}$'}
        walletName: {type: string, minLength: 1, maxLength: 80}
        openingBalance: {type: integer, format: int64}
    FinancePayload:
      type: object
      required: [version, name, onboarded, hideBalance, wallets, entries, budgets, bills, keepsakes]
      properties:
        version:
          type: integer
          enum: [1, 2]
        name:
          type: string
        onboarded:
          type: boolean
        hideBalance:
          type: boolean
        wallets:
          type: array
          items:
            type: object
        entries:
          type: array
          items:
            type: object
        budgets:
          type: array
          items:
            type: object
        bills:
          type: array
          items:
            type: object
        keepsakes:
          type: array
          items:
            type: object
        subscriptions:
          type: array
          items:
            type: object
        closedMonths:
          type: array
          items:
            type: object
        customCategories:
          type: array
          items:
            type: string
        preferences:
          type: object
          additionalProperties: true
