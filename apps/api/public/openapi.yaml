        budgets:
          type: array
          items: {$ref: '#/components/schemas/Budget'}
    BudgetResponse:
      type: object
      additionalProperties: false
      required: [budget]
      properties:
        budget: {$ref: '#/components/schemas/Budget'}
    CreateBudgetRequest:
      type: object
      additionalProperties: false
      required: [categoryId, name, defaultLimit, alertPercent]
      properties:
        categoryId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        defaultLimit: {type: integer, format: int64, minimum: 1}
        alertPercent: {type: integer, minimum: 1, maximum: 100}
    UpdateBudgetRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 120}
        defaultLimit: {type: integer, format: int64, minimum: 1}
        alertPercent: {type: integer, minimum: 1, maximum: 100}
        active: {type: boolean}
    Transaction:
      type: object
      additionalProperties: false
      required: [id, title, amount, kind, accountId, destinationAccountId, categoryId, occurredAt, note, refundOfTransactionId, version, createdAt, updatedAt, deletedAt]
      properties:
        id: {type: string, format: uuid}
